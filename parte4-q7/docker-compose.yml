services:
  app:
    build:
      context: ..
      dockerfile: parte4-q7/Dockerfile
    env_file: ../.env
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: parte4-q7/Dockerfile
    env_file: ../.env
    command: python worker.py
    depends_on:
      redis: { condition: service_healthy }
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "from fila import redis_sync; redis_sync().ping()"]
      interval: 10s
      timeout: 5s
      retries: 5

  consulta:
    build:
      context: ..
      dockerfile: parte4-q7/Dockerfile
      args: { APP_DIR: parte2-q4 }
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports: ["8001:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:17-alpine
    env_file: ../.env
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
